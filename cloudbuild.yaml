steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/backend:${SHORT_SHA}'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/frontend:${SHORT_SHA}'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '.'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/backend:${SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend Latest'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/backend:latest'

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/frontend:${SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend Latest'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/frontend:latest'

  # Deploy backend API
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aurvyz'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/backend:${SHORT_SHA}'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--max-instances=10'
      - '--update-env-vars=SMTP_HOST=smtp.zoho.in,SMTP_PORT=465,SMTP_USER=hello@aurvyz.com'

  # Deploy frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Frontend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aurvyz-frontend'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/frontend:${SHORT_SHA}'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--max-instances=10'
#ADD THIS SECTION BELOW
options:
  logging: CLOUD_LOGGING_ONLY
  
images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/backend:${SHORT_SHA}'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/backend:latest'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/frontend:${SHORT_SHA}'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/aurvyz/frontend:latest'

timeout: '3600s'
