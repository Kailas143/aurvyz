steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aurvyz:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aurvyz:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aurvyz:${SHORT_SHA}'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aurvyz'
      - '--image=gcr.io/$PROJECT_ID/aurvyz:${SHORT_SHA}'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--max-instances=10'

images:
  - 'gcr.io/$PROJECT_ID/aurvyz:${SHORT_SHA}'
  - 'gcr.io/$PROJECT_ID/aurvyz:latest'

timeout: '3600s'
