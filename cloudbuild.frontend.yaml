steps:
  # Build the frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aurvyz-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aurvyz-frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aurvyz-frontend:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aurvyz-frontend'
      - '--image=gcr.io/$PROJECT_ID/aurvyz-frontend:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--timeout=300'
      - '--max-instances=10'

images:
  - 'gcr.io/$PROJECT_ID/aurvyz-frontend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/aurvyz-frontend:latest'

timeout: '3600s'
